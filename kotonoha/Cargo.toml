[package]
name = "kotonoha"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Japanese prosody engine for TTS, replacing OpenJTalk"
repository = "https://github.com/owayo/kotonoha"
keywords = ["japanese", "tts", "prosody", "nlp", "speech"]
categories = ["text-processing", "science"]

[features]
default = []
cuda = ["ort"]
download = ["dep:ureq", "dep:sha2", "dep:tempfile", "dep:base64"]

[dependencies]
hasami = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
once_cell = { workspace = true }
ureq = { version = "3.4.2", optional = true, default-features = false, features = ["rustls", "platform-verifier", "json"] }
sha2 = { version = "0.11.0", optional = true }
tempfile = { version = "3.27.0", optional = true }
base64 = { version = "0.23.1", optional = true }
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-24", "cuda"] }

[dev-dependencies]
criterion = { workspace = true }
hasami = { workspace = true, features = ["build"] }

[[bench]]
name = "benchmark"
harness = false
