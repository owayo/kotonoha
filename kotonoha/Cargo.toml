[package]
name = "kotonoha"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Japanese prosody engine for TTS, replacing OpenJTalk"
repository = "https://github.com/owayo/kotonoha"
keywords = ["japanese", "tts", "prosody", "nlp", "speech"]
categories = ["text-processing", "science"]

[features]
default = []
# 旧 feature 名を維持する。実行時は外部ランタイム不要の専用 CPU 推論。
cuda = ["neural"]
neural = ["dep:matrixmultiply", "dep:libm", "dep:wide"]
download = ["dep:ureq", "dep:tempfile", "dep:flate2", "dep:tar"]

[dependencies]
hasami = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
once_cell = { workspace = true }
ureq = { version = "3.5.0", optional = true, default-features = false, features = ["rustls", "platform-verifier", "json"] }
sha2 = { version = "0.11.1" }
tempfile = { version = "3.27.0", optional = true }
flate2 = { version = "1.1.10", optional = true }
tar = { version = "0.4.46", optional = true, default-features = false }
matrixmultiply = { version = "0.3.11", optional = true }
libm = { version = "0.2.16", optional = true }
wide = { version = "1.7.1", optional = true }
# 基本の bulk API だけを使うため、下流が選べる 0.14 系の下限を保つ。
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
criterion = { workspace = true }
hasami = { workspace = true, features = ["build"] }
tempfile = "3.27.0"

[[bench]]
name = "benchmark"
harness = false

[[example]]
name = "knm_probe"
required-features = ["neural"]

[[example]]
name = "knm_pipeline_probe"
required-features = ["neural"]

[[example]]
name = "knm_accuracy"
required-features = ["neural"]

[[example]]
name = "knm_format_probe"
required-features = ["neural"]
