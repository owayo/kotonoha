[package]
name = "kotonoha-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kotonoha"
path = "src/main.rs"

[features]
default = []
cuda = ["neural"]
neural = ["kotonoha/neural"]

[dependencies]
kotonoha = { workspace = true, features = ["download"] }
hasami = { workspace = true, features = ["build"] }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
