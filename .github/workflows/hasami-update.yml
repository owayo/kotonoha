name: Rebuild KNM after HSD updates

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check for HSD changes without starting a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hasami-dictionary-updates
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false
          install_args: python
      - name: Check whether a release is already running
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 100 --json status --jq 'any(.[]; .status != "completed")')
          echo "busy=$busy" >> "$GITHUB_OUTPUT"
      - name: Compare published HSD checksums with the last model release
        if: ${{ steps.active.outputs.busy == 'false' }}
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/hasami_release.py check >> "$GITHUB_OUTPUT"
      - name: Start a release for the updated HSD
        if: ${{ steps.update.outputs.changed == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          HASAMI_TAG: ${{ steps.update.outputs.hasami_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f dry_run=false -f "hasami_tag=$HASAMI_TAG"
      - name: Write the result
        env:
          BUSY: ${{ steps.active.outputs.busy }}
          CHANGED: ${{ steps.update.outputs.changed }}
          HASAMI_TAG: ${{ steps.update.outputs.hasami_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          printf 'HSD release: %s\n\nChanged: %s\n\nRelease already active: %s\n\nDry run: %s\n' "$HASAMI_TAG" "$CHANGED" "$BUSY" "$DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
