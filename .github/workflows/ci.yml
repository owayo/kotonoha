name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: make setup
      - run: make ci

  windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Test model release packaging
        run: python -m unittest discover -s scripts/tests -v
      # Windows の make は POSIX シェルのレシピと互換性がないため直接実行する。
      - name: Test the Rust API and CLI
        run: cargo test --locked --workspace --exclude kotonoha-python --no-fail-fast
      - name: Test optional native inference features
        run: cargo test --locked --workspace --exclude kotonoha-python --all-features --no-fail-fast
      - name: Test Python bindings
        run: uv run --locked --project kotonoha-python python -m unittest discover -s kotonoha-python/tests -v

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # release.yml と同じターゲット・feature で配布バイナリを検査する。
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build with native inference
        run: cargo build --release --locked -p kotonoha-cli --features neural --target ${{ matrix.target }}
