[workspace]
members = ["kotonoha", "kotonoha-python", "kotonoha-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Yohei"]

[workspace.metadata.project-standard]
readme-languages = ["ja"]

[workspace.dependencies]
kotonoha = { path = "kotonoha" }
hasami = { git = "https://github.com/owayo/hasami", rev = "a6ae043f9eff4e1d76bf1a5fad0e803502db6dd0", default-features = false, features = ["analyzer"] }
pyo3 = { version = "0.29.2", features = ["extension-module"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
csv = "1.4.0"
thiserror = "2.0.20"
rayon = "1.12.0"
once_cell = "1.21.4"
encoding_rs = "0.8.41"
glob = "0.3.4"
memmap2 = "0.9.11"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
