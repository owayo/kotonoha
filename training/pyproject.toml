[project]
name = "training"
version = "0.1.0"
description = "CRF/ONNX accent model training for kotonoha"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12.1",
    "onnx>=1.23.0",
    "onnxruntime-gpu>=1.30.0; sys_platform != 'darwin'",
    "onnxruntime>=1.30.0; sys_platform == 'darwin'",
    "transformers>=5.17.0",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "pyopenjtalk-plus>=0.4.1.post9",
    "jaconv>=0.5.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }

[dependency-groups]
dev = [
    "fugashi>=1.5.2",
    "maturin>=1.15.0",
    "pytorch-crf>=0.7.2",
    "unidic-lite>=1.0.8",
]
