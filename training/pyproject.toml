[project]
name = "training"
version = "0.1.0"
description = "CRF/ONNX accent model training for kotonoha"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12.1",
    "onnx>=1.22.0",
    "onnxruntime-gpu>=1.27.0",
    "transformers>=5.12.1",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "pyopenjtalk-plus>=0.4.1.post8",
    "jaconv>=0.5.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "fugashi>=1.5.2",
    "maturin>=1.14.1",
    "pytorch-crf>=0.7.2",
    "unidic-lite>=1.0.8",
]
